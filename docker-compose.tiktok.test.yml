services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: tiktok_test
      POSTGRES_PASSWORD: tiktok_test_only
      POSTGRES_DB: tiktok_test
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiktok_test -d tiktok_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.3-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '127.0.0.1::6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
