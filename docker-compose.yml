# AASC assessment app (port 3000, SQLite).
#   make docker-up        (or: docker compose up -d --build)
# Settings come from .env (create it with `cp .env.example .env`).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AASC_IMAGE:-aasc-assessment:latest}
    container_name: aasc-app
    env_file: .env
    environment:
      # Inside the container the app always listens on 3000 and stores SQLite in the volume;
      # PORT in .env only chooses the port published on the host.
      PORT: 3000
      DATABASE_PATH: data/app.sqlite
    # Published on every interface by default, as before. Behind a reverse proxy set
    # AASC_BIND_ADDRESS=127.0.0.1 in .env so only the proxy can reach the app.
    ports:
      - '${AASC_BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000'
    volumes:
      - aasc-data:/app/data
      # Service account key for the Google Sheets sync (GOOGLE_SERVICE_ACCOUNT_KEY_FILE=secrets/...).
      # Writable: in OAuth mode the app stores the Google refresh token here.
      - ./secrets:/app/secrets
      # mapping.json of the lead sync; edit on the host, the next run picks it up.
      - ./config:/app/config:ro
    restart: unless-stopped
    # Container hardening: an init process that forwards signals and reaps children, a read-only
    # root filesystem (data lives in the volume and ./secrets), no Linux capabilities, no
    # privilege gain, and bounded memory, processes and logs.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: ${AASC_MEMORY:-512m}
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  aasc-data:
